<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>জীবনের পাঠশালা — Admin Panel</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f4f7fb;
    color:#1f2937;
}
header{
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    padding:22px;
}
header h1{margin:0 0 5px}
.container{
    max-width:900px;
    margin:25px auto;
    padding:0 15px;
}
.card{
    background:white;
    padding:25px;
    margin-bottom:20px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}
input,textarea,select{
    width:100%;
    padding:13px;
    margin:8px 0 15px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:16px;
}
textarea{min-height:180px;resize:vertical}
button{
    padding:13px 22px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}
button:hover{opacity:.9}
.logout{background:#dc2626;float:right}
.hidden{display:none}
#message{
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
}
</style>
</head>

<body>

<header>
    <h1>জীবনের পাঠশালা</h1>
    <p>Admin Panel</p>
</header>

<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
    <h2>🔐 Admin Login</h2>

    <input type="email" id="email" placeholder="Admin Email">

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p id="loginMessage"></p>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden">

    <div class="card">
        <button class="logout" onclick="logout()">Logout</button>

        <h2>✍️ নতুন পোস্ট তৈরি করুন</h2>

        <div id="message"></div>

        <label>পোস্টের শিরোনাম</label>
        <input type="text" id="title" placeholder="যেমন: জীবনে সফল হওয়ার ৫টি উপায়">

        <label>ক্যাটাগরি</label>
        <select id="category">
            <option value="মোটিভেশন">মোটিভেশন</option>
            <option value="দৈনন্দিন জীবনযাপন">দৈনন্দিন জীবনযাপন</option>
            <option value="আত্মউন্নয়ন">আত্মউন্নয়ন</option>
            <option value="শিক্ষামূলক">শিক্ষামূলক</option>
            <option value="ইসলামিক">ইসলামিক</option>
        </select>

        <label>পোস্টের বিষয়বস্তু</label>
        <textarea id="content" placeholder="এখানে আপনার পোস্ট লিখুন..."></textarea>

        <button onclick="publishPost()">🚀 পোস্ট প্রকাশ করুন</button>
    </div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyDsvvY7diXkCl1UHaZ9IEc2D0U1AkAxd8U",
    authDomain: "jiboner-pathshala.firebaseapp.com",
    projectId: "jiboner-pathshala",
    storageBucket: "jiboner-pathshala.firebasestorage.app",
    messagingSenderId: "964876959034",
    appId: "1:964876959034:web:ec0c7d3f2f7ebdc8ade403",
    measurementId: "G-FCFKGRKVH3"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


// LOGIN
window.login = async function(){

    const email = document.getElementById("email").value;

    const password = document.getElementById("password").value;

    const msg = document.getElementById("loginMessage");

    try{

        await signInWithEmailAndPassword(auth,email,password);

        msg.innerText = "সফলভাবে Login হয়েছে ✅";

    }catch(error){

        msg.innerText = "Email অথবা Password ভুল ❌";

    }

};


// LOGIN STATUS
onAuthStateChanged(auth,(user)=>{

    if(user){

        document.getElementById("loginBox").classList.add("hidden");

        document.getElementById("adminPanel").classList.remove("hidden");

    }else{

        document.getElementById("loginBox").classList.remove("hidden");

        document.getElementById("adminPanel").classList.add("hidden");

    }

});


// PUBLISH POST
window.publishPost = async function(){

    const title = document.getElementById("title").value.trim();

    const category = document.getElementById("category").value;

    const content = document.getElementById("content").value.trim();

    const message = document.getElementById("message");

    if(!title || !content){

        message.innerText = "⚠️ শিরোনাম এবং পোস্টের বিষয়বস্তু লিখুন";

        return;

    }

    try{

        await addDoc(collection(db,"posts"),{

            title:title,

            category:category,

            content:content,

            createdAt:serverTimestamp()

        });

        message.innerText = "✅ পোস্ট সফলভাবে প্রকাশ হয়েছে!";

        document.getElementById("title").value="";

        document.getElementById("content").value="";

    }catch(error){

        message.innerText = "❌ পোস্ট প্রকাশ করা যায়নি: "+error.message;

    }

};


// LOGOUT
window.logout = function(){

    signOut(auth);

};

</script>

</body>
  </html>
