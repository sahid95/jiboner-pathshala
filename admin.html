<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>জীবনের পাঠশালা - Admin Login</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Noto Sans Bengali',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

background:linear-gradient(135deg,#2563eb,#7c3aed);

}

/* Animated Background */

body::before{

content:"";

position:absolute;

width:700px;

height:700px;

background:rgba(255,255,255,.08);

border-radius:50%;

left:-200px;

top:-200px;

animation:move1 10s infinite alternate;

}

body::after{

content:"";

position:absolute;

width:500px;

height:500px;

background:rgba(255,255,255,.06);

border-radius:50%;

right:-150px;

bottom:-150px;

animation:move2 8s infinite alternate;

}

@keyframes move1{

from{transform:translateY(0)}

to{transform:translateY(80px)}

}

@keyframes move2{

from{transform:translateX(0)}

to{transform:translateX(-80px)}

}

.login-card{

width:420px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(18px);

padding:35px;

border-radius:25px;

box-shadow:0 20px 40px rgba(0,0,0,.25);

z-index:5;

}

.logo{

font-size:60px;

text-align:center;

margin-bottom:10px;

}

h1{

text-align:center;

color:#fff;

margin-bottom:5px;

}

.subtitle{

text-align:center;

color:#e5e7eb;

margin-bottom:30px;

}

.input-box{

margin-bottom:18px;

}

.input-box label{

display:block;

color:#fff;

margin-bottom:8px;

}

.input-box input{

width:100%;

padding:14px;

border:none;

border-radius:12px;

font-size:16px;

outline:none;

}

.password-box{

position:relative;

}

.toggle-password{

position:absolute;

right:12px;

top:50%;

transform:translateY(-50%);

cursor:pointer;

font-size:18px;

}

.login-btn{

width:100%;

padding:14px;

border:none;

border-radius:12px;

background:#10b981;

color:white;

font-size:18px;

cursor:pointer;

transition:.3s;

}

.login-btn:hover{

transform:scale(1.03);

}

#loginMessage{

margin-top:15px;

text-align:center;

color:#fff;

font-weight:bold;

}

</style>

</head>

<body>

<div class="login-card">

<div class="logo">📖</div>

<h1>জীবনের পাঠশালা</h1>

<p class="subtitle">Admin Login</p>

<div class="input-box">

<label>Email</label>

<input type="email" id="email" placeholder="admin@email.com">

</div>

<div class="input-box">

<label>Password</label>

<div class="password-box">

<input type="password" id="password" placeholder="********">

<span class="toggle-password" onclick="togglePassword()">👁️</span>

</div>

</div>

<button class="login-btn" onclick="login()">

🔐 Login

</button>

<p id="loginMessage"></p>

</div>

<script>

function togglePassword(){

const p=document.getElementById("password");

p.type=p.type==="password"?"text":"password";

}

</script>

</body>
</html>
